sonar.projectKey=Fizryan_stokku
sonar.organization=fizryan
sonar.projectName=Stokku

sonar.sources=src
sonar.tests=tests
sonar.inclusions=src/**
sonar.test.inclusions=tests/**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/data/**,**/coverage/**,**/build-wrapper-dump.json,tests/**/*.test.ts

# Exclude frontend UI and CLI bootstrap from unit test coverage calculation
sonar.coverage.exclusions=src/client/**,src/server/index.ts

sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.server.json,tsconfig.client.json,tsconfig.test.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
