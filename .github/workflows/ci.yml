name: CI

on:
  push:
    branches:
      - master
      - dev-fizryan
      - dev-fathir
  pull_request:
    branches:
      - master
      - dev-fizryan
      - dev-fathir
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check (linter, formatter, import organizer)
        run: pnpm run check

  test:
    name: Typecheck & Tests (Node ${{ matrix.node-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict TypeScript typecheck
        run: pnpm run typecheck

      - name: Run automated integration tests
        run: pnpm test

  sonarcloud:
    name: SonarCloud Quality Gate
    needs: [quality, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository (full git history for blame & metrics)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Production Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client & server bundles
        run: pnpm run build

  docker-smoke:
    name: Docker Build & Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stokku:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container in background
        run: |
          docker run -d --name stokku-smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            stokku:smoke-test

      - name: Verify non-root user execution
        run: |
          USER=$(docker exec stokku-smoke whoami)
          echo "Container running as user: $USER"
          if [ "$USER" != "node" ]; then
            echo "Expected container user 'node', got '$USER'"
            exit 1
          fi

      - name: Probe HTTP health endpoint (/api/health)
        run: |
          echo "Waiting for Stokku service to be ready..."
          ATTEMPTS=0
          MAX_ATTEMPTS=15
          UNTIL_READY=false

          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              BODY=$(curl -s http://127.0.0.1:3000/api/health)
              echo "Healthcheck response: $BODY"
              if echo "$BODY" | grep -q '"status":"ok"'; then
                echo "Stokku server is healthy and responding with 200 OK!"
                UNTIL_READY=true
                break
              fi
            fi
            echo "Healthcheck not ready yet (HTTP $STATUS), retrying in 2s... (attempt $((ATTEMPTS+1))/$MAX_ATTEMPTS)"
            sleep 2
            ATTEMPTS=$((ATTEMPTS+1))
          done

          if [ "$UNTIL_READY" != "true" ]; then
            echo "Smoke test failed! Dumping container logs:"
            docker logs stokku-smoke
            exit 1
          fi

      - name: Cleanup container
        if: always()
        run: |
          docker stop stokku-smoke || true
          docker rm stokku-smoke || true
