name: Release & CD

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - master
    types:
      - completed
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish-container:
    name: Build & Push Container Image (GHCR)
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & OCI labels
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push multi-arch image (amd64 & arm64)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    name: Create GitHub Release
    needs: publish-container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Stokku ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 📦 Docker Container Image

            Image resmi Stokku untuk rilis ini telah dipublikasikan ke **GitHub Container Registry (GHCR)**:

            ```bash
            # Tarik image resmi dari GHCR menggunakan tag versi rilis
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}

            # Jalankan image container
            docker run -d \
              --name stokku-app \
              -p 3000:3000 \
              -v /path/to/data:/app/data \
              -e NODE_ENV=production \
              -e PORT=3000 \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ## 📝 Catatan Rilis
            Rilis ini otomatis dibangun melalui GitHub Actions CI/CD pipeline setelah lolos seluruh rangkaian Quality Gate (Biome check, Typecheck, Automated Tests, SonarCloud Scan, serta Docker Build & Smoke Test).
